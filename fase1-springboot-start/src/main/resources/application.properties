# Configuración de la aplicación Spring Boot - Fase 1 Start
spring.application.name=fase1-springboot-start

# Puerto de la aplicación
server.port=8080

# Configuración de OpenAI
ia.openai.key=${OPENAI_API_KEY:}
ia.openai.base=${OPENAI_API_BASE:https://api.openai.com/v1}
ia.openai.model=${OPENAI_API_MODEL:gpt-3.5-turbo}
ia.openai.max-tokens=${OPENAI_API_MAX_TOKENS:500}
ia.openai.timeout=${OPENAI_API_TIMEOUT:30s}

# Configuración de Anthropic
ia.anthropic.key=${ANTHROPIC_API_KEY:}
ia.anthropic.base=${ANTHROPIC_API_BASE:https://api.anthropic.com/v1}
ia.anthropic.model=${ANTHROPIC_API_MODEL:claude-3-haiku-20240307}
ia.anthropic.max-tokens=${ANTHROPIC_API_MAX_TOKENS:500}
ia.anthropic.timeout=${ANTHROPIC_API_TIMEOUT:30s}

# Logging
logging.level.root=INFO
logging.level.com.joedayz.ia=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
