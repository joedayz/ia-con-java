spring:
  application:
    name: fase3-spring-ai-chatbot
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.7
          num-predict: 2048
          num-ctx: 16384
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:mxbai-embed-large}

  # Configuración de H2 Database para memoria persistente
  datasource:
    url: jdbc:h2:file:./data/chatbot-memory
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

app:
  chat:
    provider: ollama
    memory:
      repository: ${APP_CHAT_MEMORY_REPOSITORY:jdbc}
      max-messages: ${APP_CHAT_MEMORY_MAX_MESSAGES:10}

# Configuración de actuator para health checks
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logs para debug
logging:
  level:
    org.springframework.ai: INFO
    com.joedayz: INFO

# Configuración de Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    displayRequestDuration: true
    filter: true
    syntaxHighlight:
      activated: true

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    uri-encoding: UTF-8
