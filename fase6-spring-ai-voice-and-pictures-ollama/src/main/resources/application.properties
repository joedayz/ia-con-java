# =============================================
# Fase 6 - Spring AI Voice and Pictures (Ollama)
# =============================================

server.port=8080

# --- Ollama ---
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}

# Modelo principal (chat + vision)
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2-vision}
spring.ai.ollama.chat.options.temperature=${OLLAMA_TEMPERATURE:0.2}

# --- Voice local helpers ---
# macOS: comando `say` para TTS
app.voice.tts.command=${APP_VOICE_TTS_COMMAND:say}
app.voice.tts.default-voice=${APP_VOICE_TTS_DEFAULT_VOICE:Monica}

# STT opcional con whisper CLI (https://github.com/openai/whisper)
app.voice.stt.command=${APP_VOICE_STT_COMMAND:whisper}
app.voice.stt.model=${APP_VOICE_STT_MODEL:base}
app.voice.stt.language=${APP_VOICE_STT_LANGUAGE:es}

# --- Multipart (para subida de archivos de audio/imagen) ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
