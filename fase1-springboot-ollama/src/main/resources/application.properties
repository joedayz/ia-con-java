# Configuración de la aplicación Spring Boot - Fase 1 Ollama
spring.application.name=fase1-springboot-ollama

# Puerto de la aplicación
server.port=8080

# Configuración de Ollama
ia.ollama.base=${OLLAMA_BASE_URL:http://localhost:11434}
ia.ollama.model=${OLLAMA_MODEL:llama3.2}
ia.ollama.max-tokens=${OLLAMA_MAX_TOKENS:500}
ia.ollama.timeout=${OLLAMA_TIMEOUT:2m}

# Logging
logging.level.root=INFO
logging.level.com.joedayz.ia=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
