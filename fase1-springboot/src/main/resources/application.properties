# Configuración de la aplicación Spring Boot - Fase 1
spring.application.name=fase1-springboot

# Puerto de la aplicación
server.port=8080

# Configuración de OpenAI API
# Estas se pueden sobrescribir con variables de entorno:
# - OPENAI_API_KEY
# - OPENAI_API_BASE
openai.api.key=${OPENAI_API_KEY:}
openai.api.base=${OPENAI_API_BASE:https://api.openai.com/v1}
openai.api.model=${OPENAI_API_MODEL:gpt-3.5-turbo}
openai.api.max-tokens=${OPENAI_API_MAX_TOKENS:500}
openai.api.timeout=${OPENAI_API_TIMEOUT:30s}

# Logging
logging.level.root=INFO
logging.level.com.joedayz.ia=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
