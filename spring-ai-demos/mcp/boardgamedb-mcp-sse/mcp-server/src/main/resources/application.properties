spring.application.name=mcp-server
server.port=3001


# PostgreSQL datasource (matches compose.yaml)
spring.datasource.url=jdbc:postgresql://localhost:5432/boardgamedb
spring.datasource.username=myuser
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver

# Ensure schema.sql/import.sql run for non-embedded DBs like PostgreSQL
spring.sql.init.mode=always
