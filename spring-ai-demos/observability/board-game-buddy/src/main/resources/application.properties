spring.application.name=Board Game Buddy
spring.servlet.multipart.max-file-size=10MB

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
# gpt-image-1 no admite response_format (HTTP 400). SpringAiImageService no lo envía.
spring.ai.openai.image.options.model=gpt-image-1
spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.collection-name=board-game-buddy

management.endpoints.web.exposure.include=health,metrics,prometheus
management.tracing.sampling.probability=1.0

spring.autoconfigure.exclude=org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
otlp.tracing.enabled=${OTLP_TRACING_ENABLED:false}
otlp.tracing.url=${OTLP_TRACING_URL:http://localhost:4317}


### Not recommended for production
