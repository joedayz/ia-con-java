server.port=0

spring.ai.openai.api-key=${OPENAI_API_KEY:${SPRING_AI_OPENAI_API_KEY}}
spring.ai.openai.chat.options.model=gpt-4o-mini

spring.cloud.function.definition=\
  fileSupplier|\
  documentReader|\
  splitter|\
  titleDeterminer|\
  vectorStoreConsumer

#
# Directory watched by spring-file-supplier.
# Use a project-relative folder by default so it works on macOS/Linux/Windows.
# Override with an absolute path if you prefer, e.g.:
#   file.supplier.directory=file:/absolute/path/to/dropoff
#
file.supplier.directory=${FILE_SUPPLIER_DIRECTORY:./dropoff}
file.supplier.filename-regex=.*\.(pdf|docx|txt)

spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.collection-name=board-game-buddy
