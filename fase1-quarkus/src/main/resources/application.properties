# Configuración de la aplicación Quarkus - Fase 1
quarkus.application.name=fase1-quarkus

# Puerto de la aplicación
quarkus.http.port=8080

# Configuración de OpenAI API
# Estas se pueden sobrescribir con variables de entorno:
# - OPENAI_API_KEY
# - OPENAI_API_BASE
openai.api.base=${OPENAI_API_BASE:https://api.openai.com/v1}
openai.api.model=${OPENAI_API_MODEL:gpt-3.5-turbo}
openai.api.max-tokens=${OPENAI_API_MAX_TOKENS:500}
openai.api.timeout=${OPENAI_API_TIMEOUT:30s}

# Logging
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.level=INFO
quarkus.log.category."com.joedayz.ia".level=DEBUG
