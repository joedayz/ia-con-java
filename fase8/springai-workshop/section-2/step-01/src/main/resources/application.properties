spring.application.name=springai-workshop-section2-step-01

server.port=8080

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.temperature=0
spring.ai.openai.chat.options.max-tokens=1024

logging.level.org.springframework.ai.openai=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.dev.springai.workshop.car=DEBUG

spring.datasource.url=jdbc:h2:mem:car_management;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
