spring.application.name=springai-workshop-section2-step-02

server.port=8080

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5
spring.ai.anthropic.chat.options.temperature=0
spring.ai.anthropic.chat.options.max-tokens=1024

logging.level.org.springframework.ai.anthropic=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.dev.springai.workshop.car=DEBUG

spring.datasource.url=jdbc:h2:mem:car_management;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
