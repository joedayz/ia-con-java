spring.application.name=springai-workshop-step-02

server.port=8080

# --- Proveedor Anthropic (Claude) ---
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.options.model=claude-haiku-4-5

# --- Step 02: parámetros del modelo (equivalente al workshop Quarkus step-02) ---
#
# Temperatura: aleatoriedad de las respuestas (0 = más determinista, 1+ = más creativo).
# Prueba: 0.1 vs 1.5 con "Describe a sunset over the mountains"
spring.ai.anthropic.chat.options.temperature=1.0
#
# Máximo de tokens en la respuesta (Anthropic usa max-tokens, no max-completion-tokens).
# Prueba: 20 para ver respuestas truncadas
spring.ai.anthropic.chat.options.max-tokens=1000
#
# top-p (nucleus sampling): alternativa en Claude al frequency-penalty de OpenAI.
# Valores bajos reducen diversidad; valores altos la aumentan. Prueba: 0.1 vs 1.0
spring.ai.anthropic.chat.options.top-p=1.0

# Logging de peticiones/respuestas al modelo (similar a log-requests en Quarkus)
logging.level.org.springframework.ai.anthropic=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
