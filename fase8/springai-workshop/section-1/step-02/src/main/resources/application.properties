spring.application.name=springai-workshop-step-02

server.port=8080

# OpenAI — requiere OPENAI_API_KEY (equiv. quarkus.langchain4j.openai.*)
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o

# --- Step 02: parámetros del modelo (equivalente al workshop Quarkus step-02) ---
#
# Temperatura: aleatoriedad de las respuestas (0 = más determinista, 1+ = más creativo).
# Prueba: 0.1 vs 1.5 con "Describe a sunset over the mountains"
spring.ai.openai.chat.options.temperature=0.1
#
# Máximo de tokens en la respuesta (equiv. max-completion-tokens en Quarkus).
# Prueba: 20 para ver respuestas truncadas
spring.ai.openai.chat.options.max-tokens=1000
#
spring.ai.openai.chat.options.frequency-penalty=0
#
# top-p (nucleus sampling): alternativa a temperature en algunos modelos.
# Prueba: comenta temperature arriba y descomenta la línea siguiente (p. ej. 0.1 vs 1.0)
# spring.ai.openai.chat.options.top-p=1.0

# Peticiones/respuestas visibles al chatear (equiv. log-requests / log-responses en Quarkus).
# SimpleLoggerAdvisor en CustomerSupportAgent + niveles DEBUG del proveedor.
logging.level.org.springframework.ai.openai=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.dev.springai.workshop=DEBUG
