spring.application.name=springai-workshop-step-06

server.port=8080

# PostgreSQL + pgvector (docker compose en este directorio: docker compose up -d)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5436}/${POSTGRES_DB:miles_rag}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dimensiones han de coincidir con el modelo de embeddings (OpenAI text-embedding-3-small por defecto: 1536)
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.schema-validation=false
spring.ai.vectorstore.pgvector.table-name=vector_store

# Chat: OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=1.0
spring.ai.openai.chat.options.max-tokens=1000
spring.ai.openai.embedding.options.model=text-embedding-3-small

# RAG manual (sustituye easy-rag.path de step-05)
app.rag.location=classpath:rag/
app.rag.max-segment-size=100
app.rag.max-overlap-size=25
app.rag.max-results=3

# Peticiones/respuestas visibles al chatear (equiv. log-requests / log-responses en Quarkus).
logging.level.org.springframework.ai.openai=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.dev.springai.workshop=DEBUG
logging.level.dev.springai.workshop.rag=INFO
