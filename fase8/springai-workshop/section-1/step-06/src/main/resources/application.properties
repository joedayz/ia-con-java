spring.application.name=springai-workshop-step-06

server.port=8080

# Chat: OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=1.0
spring.ai.openai.chat.options.max-tokens=1000
# Embeddings locales (equivalente a bge-small-en-q en Quarkus; mismo modelo en ingesta y retrieval)
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.embedding.options.model=nomic-embed-text
spring.autoconfigure.exclude=org.springframework.ai.model.ollama.autoconfigure.OllamaChatAutoConfiguration

# RAG manual (sustituye easy-rag.path de step-05)
app.rag.location=classpath:rag/
app.rag.max-segment-size=100
app.rag.max-overlap-size=25
app.rag.max-results=3

# Peticiones/respuestas visibles al chatear (equiv. log-requests / log-responses en Quarkus).
logging.level.org.springframework.ai.openai=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.dev.springai.workshop=DEBUG
logging.level.dev.springai.workshop.rag=INFO
