spring.application.name=springai-workshop-step-01

server.port=8080

# OpenAI — requiere OPENAI_API_KEY en el entorno
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.7

# Peticiones/respuestas visibles al chatear (equiv. log-requests en Quarkus).
# SimpleLoggerAdvisor en CustomerSupportAgent + niveles DEBUG del proveedor.
logging.level.org.springframework.ai.openai=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.dev.springai.workshop=DEBUG
