spring.application.name=springai-workshop-step-11

server.port=8080

# OpenAI
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=1.0
spring.ai.openai.chat.options.max-tokens=1000

# Chaos testing (descomenta para probar fallback; equiv. quarkus.langchain4j.openai.base-url)
#spring.ai.openai.base-url=https://api.example.com


app.rag.location=classpath:rag/
app.rag.max-segment-size=100
app.rag.max-overlap-size=25
app.rag.max-results=3

# PostgreSQL (usar el docker compose de section-1/step-06)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5436}/${POSTGRES_DB:miles_rag}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.toolcallback.enabled=true
spring.ai.mcp.client.sse.connections.weather.url=http://localhost:8081

app.guardrail.prompt-injection.threshold=0.7

# --- Observability (step-10) ---
# Logging de peticiones/respuestas al LLM (equiv. log-requests / log-responses)
logging.level.org.springframework.ai.openai=DEBUG
logging.level.org.springframework.ai.chat.client=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.pattern.console=%d{HH:mm:ss} %-5p traceId=%X{traceId:-} spanId=%X{spanId:-} [%logger{2}] %msg%n

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.export.prometheus.enabled=true
management.tracing.sampling.probability=1.0
# Descomenta si tienes un colector OTLP local (Jaeger, Tempo, etc.)
#management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

# --- Fault tolerance (equiv. @Timeout @Retry @Fallback) ---
resilience4j.retry.instances.llmChat.max-attempts=4
resilience4j.retry.instances.llmChat.wait-duration=100ms
resilience4j.timelimiter.instances.llmChat.timeout-duration=5s

app.llm.chat.timeout-ms=5000

# Step-11: perfil ollama-local para chat en local (equiv. Jlama en Quarkus)
# ./mvnw spring-boot:run -Dspring-boot.run.profiles=ollama-local

logging.level.dev.springai.workshop=INFO
spring.ai.openai.embedding.options.model=text-embedding-3-small
