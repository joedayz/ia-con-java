# Perfil ollama-local: inferencia de chat en local (equivalente a Jlama en Quarkus step-11).
# Ejecutar: ./mvnw spring-boot:run -Dspring-boot.run.profiles=ollama-local
# Requiere: ollama pull llama3.2 && ollama pull nomic-embed-text

spring.autoconfigure.exclude=org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration

spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0

logging.level.org.springframework.ai.ollama=DEBUG
logging.level.org.springframework.ai.chat.client.advisor=DEBUG
logging.level.org.springframework.ai.openai=WARN
logging.level.dev.springai.workshop=DEBUG
