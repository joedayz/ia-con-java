version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: fase4-openai-pgvector
    environment:
      POSTGRES_DB: fase4_openai_ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgvector_openai_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fase4_openai_ragdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgvector_openai_data:
    driver: local
