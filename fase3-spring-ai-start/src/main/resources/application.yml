  # TODO LAB 8: Configuración de H2 Database para memoria persistente
  datasource:
    url: jdbc:h2:file:./data/chatbot-memory
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

