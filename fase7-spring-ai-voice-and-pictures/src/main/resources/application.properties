# =============================================
# Fase 6 - Spring AI Voice and Pictures
# =============================================

server.port=8080

# --- OpenAI ---
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Chat model (para Vision)
spring.ai.openai.chat.options.model=gpt-4o

# Image model (gpt-image-1)
spring.ai.openai.image.options.model=gpt-image-1

# Text-to-Speech (TTS)
spring.ai.openai.audio.speech.options.model=tts-1
spring.ai.openai.audio.speech.options.voice=alloy

# Speech-to-Text (Whisper)
spring.ai.openai.audio.transcription.options.model=whisper-1

# --- Multipart (para subida de archivos de audio/imagen) ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
